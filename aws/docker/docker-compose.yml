################################################################################
# NHCE Lost & Found — Docker Compose (Local Development)
# Run the full stack locally: Flask app + PostgreSQL + pgAdmin
# Usage: docker compose up -d
################################################################################

version: "3.9"

services:

  # ─── Flask Application ──────────────────────────────────────────────────────
  app:
    build:
      context: ../..          # Root of the project (where app.py lives)
      dockerfile: aws/docker/Dockerfile
    container_name: nhce-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - DATABASE_URL=postgresql://nhce_admin:nhce_dev_pass@db:5432/nhce_lostandfound
      - SECRET_KEY=dev-secret-key-change-in-production
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - AWS_REGION=ap-south-1
      - S3_IMAGES_BUCKET=nhce-local-dev-images
    volumes:
      - ../../static/uploads:/app/static/uploads   # Persist uploads locally
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nhce-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: nhce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nhce_lostandfound
      POSTGRES_USER: nhce_admin
      POSTGRES_PASSWORD: nhce_dev_pass
    ports:
      - "5432:5432"           # Expose for local DB tools (DBeaver, pgAdmin)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - nhce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhce_admin -d nhce_lostandfound"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── pgAdmin (Database GUI) ─────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nhce-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nhce.edu
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    depends_on:
      - db
    networks:
      - nhce-network
    profiles:
      - tools                 # Only start with: docker compose --profile tools up

networks:
  nhce-network:
    driver: bridge
    name: nhce-network

volumes:
  postgres_data:
    name: nhce-postgres-data
